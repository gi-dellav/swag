[package]
name = "swag-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Easy-to-use CLI for swag (static webapp generator)"

[[bin]]
name = "swag"
path = "src/main.rs"

[dependencies]
swag-corelib = { version="1.0.0", path="../swag-corelib" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
dialoguer = { version = "0.12.0", default-features = false, features = ["completion", "editor"] }
colorized = "1.0.0"

[dev-dependencies]
serde_json = "1"
