name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Build swag
        run: cargo build --release -p swag-cli
      - name: Scaffold, build and test
        env:
          SWAG_HOME: ${{ runner.temp }}/swag-home
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/e2e-app"
          ./target/release/swag new e2e-app --template clean --output "$APP" --no-git-init
          ./target/release/swag build "$APP"
          test -n "$(find "$APP/dist" -type f -print -quit)"
          ./target/release/swag test "$APP"

  e2e-fullstack:
    name: e2e (fullstack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Build swag
        run: cargo build --release -p swag-cli
      - name: Scaffold, build and test
        env:
          SWAG_HOME: ${{ runner.temp }}/swag-home
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/e2e-app"
          ./target/release/swag new e2e-app --template fullstack --output "$APP" --no-git-init
          ./target/release/swag build "$APP"
          test -n "$(find "$APP/frontend/dist" -type f -print -quit)"
          ./target/release/swag test "$APP"

  e2e-tauri:
    name: e2e (tauri)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Build swag
        run: cargo build --release -p swag-cli
      - name: Scaffold, build and test
        env:
          SWAG_HOME: ${{ runner.temp }}/swag-home
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/e2e-app"
          ./target/release/swag new e2e-app --template tauri --output "$APP" --no-git-init
          ./target/release/swag build "$APP"
          test -n "$(find "$APP/dist" -type f -print -quit)"
          test -n "$(find "$APP/src-tauri/target/release/bundle" -type f -print -quit)"
          ./target/release/swag test "$APP"
