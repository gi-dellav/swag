[workspace]
members = ["swag-corelib", "swag-cli"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
# Edition 2024 requires 1.85; let-chains (`if let ... && ...`) require 1.88.
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["Giuseppe Della Vedova"]
repository = "https://github.com/gi-dellav/swag"
